<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Royal Stitch Studio</title>
    <meta name="description" content="Sign in to track fittings, measurements and orders at Royal Stitch Studio." />
    <meta name="theme-color" content="#17140F" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-google" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h6a5.1 5.1 0 0 1-2.2 3.4v2.8h3.6c2.1-2 3.2-4.8 3.2-8.2z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.4-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14a6.6 6.6 0 0 1 0-4.1V7H2a11 11 0 0 0 0 9.9L5.7 14z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2 7l3.7 2.9C6.6 7.3 9.1 5.4 12 5.4z"/></symbol>
        <symbol id="i-facebook" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.6-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></symbol>
    </svg>

    <div class="grain" aria-hidden="true"></div>
    <div class="cursor" aria-hidden="true"><span class="cursor-dot"></span><span class="cursor-ring"><span class="cursor-label" id="cursorLabel"></span></span></div>

    <div class="auth">
        <aside class="auth-side">
            <a href="index.html" class="logo" aria-label="Royal Stitch Studio home">
                <span class="logo-mark">RS</span>
                <span class="logo-text">Royal Stitch <span class="logo-sub">Studio</span></span>
            </a>

            <p class="auth-quote" data-split>
                <span class="line">Your fittings,</span>
                <span class="line"><em>kept on file.</em></span>
            </p>

            <div class="auth-swatches" aria-hidden="true">
                <div class="cloth-brocade"></div>
                <div class="cloth-velvet"></div>
                <div class="cloth-check"></div>
            </div>

            <div class="auth-side-foot">
                <span>Atelier — New Delhi</span>
                <span>Est. 2014</span>
            </div>
        </aside>

        <main class="auth-main">
            <div class="auth-top">
                <a href="index.html"><svg><use href="#i-left"/></svg> Back to site</a>
                <a href="index.html#contact">Need help?</a>
            </div>

            <div class="auth-form-wrap">
                <h1 data-split><span class="line">Welcome</span><span class="line"><em>back.</em></span></h1>
                <p data-reveal style="--d:.3s">Sign in to see your fitting dates and saved measurements.</p>

                <form class="auth-form" id="loginForm" novalidate data-reveal style="--d:.4s">
                    <div class="field">
                        <input type="email" id="email" name="email" placeholder=" " required autocomplete="email" />
                        <label for="email">Email address</label>
                    </div>
                    <div class="field">
                        <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password" class="has-toggle" />
                        <label for="password">Password</label>
                        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
                    </div>

                    <div class="auth-row">
                        <label class="check"><input type="checkbox" id="remember" /> Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-ink auth-submit" id="loginBtn" data-magnetic data-strength="0.12"><span>Sign in</span> <svg><use href="#i-arrow"/></svg></button>
                    <p class="auth-msg" id="authMsg" role="status" aria-live="polite"></p>

                    <div class="divider">or</div>
                    <div class="socials">
                        <a href="#" class="btn btn-line btn-sm"><svg><use href="#i-google"/></svg>Google</a>
                        <a href="#" class="btn btn-line btn-sm"><svg><use href="#i-facebook"/></svg>Facebook</a>
                    </div>
                </form>

                <p class="auth-alt" data-reveal style="--d:.5s">New to the studio? <a href="index.html#contact">Book your first fitting</a></p>
            </div>
        </main>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        (() => {
            const form = document.getElementById('loginForm');
            const msg = document.getElementById('authMsg');
            const btn = document.getElementById('loginBtn');
            const pw = document.getElementById('password');
            const toggle = document.getElementById('pwToggle');

            toggle.addEventListener('click', () => {
                const show = pw.type === 'password';
                pw.type = show ? 'text' : 'password';
                toggle.textContent = show ? 'Hide' : 'Show';
                toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });

            form.querySelectorAll('[required]').forEach(i => i.addEventListener('input', () => i.closest('.field').classList.remove('is-invalid')));

            form.addEventListener('submit', e => {
                e.preventDefault();
                const email = form.email;
                const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
                const pwOk = pw.value.length >= 6;
                email.closest('.field').classList.toggle('is-invalid', !emailOk);
                pw.closest('.field').classList.toggle('is-invalid', !pwOk);
                msg.classList.remove('is-ok');
                if (!emailOk) { msg.textContent = 'Please enter a valid email.'; email.focus(); return; }
                if (!pwOk) { msg.textContent = 'Password needs at least 6 characters.'; pw.focus(); return; }

                // Demo only: replace with a real auth request.
                msg.textContent = '';
                btn.classList.add('is-loading');
                btn.innerHTML = '<span class="spinner"></span> Signing in';
                setTimeout(() => {
                    btn.classList.remove('is-loading');
                    btn.innerHTML = '<span>Sign in</span> <svg><use href="#i-arrow"/></svg>';
                    msg.classList.add('is-ok');
                    msg.textContent = 'Signed in (demo). Connect your backend to continue.';
                }, 1200);
            });
        })();
    </script>
</body>
</html>
